<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <title>Lấy lại mật khẩu - Mã OTP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6e6e6;
      margin: 0;
      padding: 40px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 40px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      max-height: 80px;
      display: inline-block;
    }

    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #333333;
      margin-top: 0;
      margin-bottom: 30px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #333333;
      margin: 0 0 16px 0;
    }

    .otp-text {
      font-size: 16px;
      font-weight: bold;
    }

    .warning-text {
      font-weight: normal;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-container">
      <img class="logo" src="cid:logo.png" alt="VNA GROUP" />
    </div>
    <h1>Xin chào, $1</h1>
    <p>Bạn vừa yêu cầu khôi phục mật khẩu cho tài khoản <strong>$2</strong>. Dưới đây là mã OTP của bạn: <strong
        class="otp-text">$3</strong></p>
    <p class="warning-text">Lưu ý quan trọng: Mã OTP có hiệu lực trong <strong>5 phút</strong></p>
    <p>Không chia sẻ mã này với bất kỳ ai, kể cả nhân viên hỗ trợ.</p>
    <p>Nếu bạn không yêu cầu khôi phục mật khẩu, vui lòng bỏ qua email này</p>
  </div>
</body>

</html>
